name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile buy bots
        run: python3 -m py_compile buybot.py buybot5m.py buybothourly.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
