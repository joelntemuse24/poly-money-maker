name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Compile mint + pathlog
        run: python3 -m py_compile mintbot.py pathlog.py check_path_backtest.py buy/book.py buy/market.py buy/chain.py buy/contracts.py buy/mint_sell.py buy/mint_loops.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
