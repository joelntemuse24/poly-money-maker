name: Deploy to GCP

on:
  push:
    branches: [main]
    paths:
      - 'buybot.py'
      - 'buybot5m.py'
      - 'buybothourly.py'
      - 'buy/**'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/poly-money-maker
            git pull origin main
            pip install -r requirements.txt --quiet
            # Do NOT systemctl restart here. A blind restart starts disabled units
            # and can re-enable bleeding bots after a force-stop. Code is pulled;
            # operators start/restart services deliberately after validation.
            echo "Pulled $(git rev-parse --short HEAD) at $(date)"
            echo "Services NOT restarted. Active:"
            systemctl is-active polybuybot polybuybot5m polybuybothourly || true
            echo "Enabled:"
            systemctl is-enabled polybuybot polybuybot5m polybuybothourly || true
