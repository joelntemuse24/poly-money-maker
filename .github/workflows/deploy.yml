name: Deploy to GCP

on:
  push:
    branches: [main]
    paths:
      - 'mintbot.py'
      - 'pathlog.py'
      - 'check_path_backtest.py'
      - 'buy/**'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd ~/poly-money-maker
            git pull origin main
            .venv/bin/python -m pip install -r requirements.txt --quiet
            # Do NOT systemctl restart here. A blind restart starts disabled units
            # and can re-enable retired buy/hedge/complement bots after a force-stop.
            # Live units are polymintbot + polypathlog (15m) only; operators
            # start/restart those deliberately after validation.
            echo "Pulled $(git rev-parse --short HEAD) at $(date)"
            echo "Services NOT restarted. Live (mint + 15m pathlog):"
            systemctl is-active polymintbot polypathlog || true
            echo "Enabled:"
            systemctl is-enabled polymintbot polypathlog || true
            echo "Retired (must stay inactive):"
            systemctl is-active polybuybot polybuybot5m polybuybothourly polycomplement polydangerzone 2>/dev/null || true
