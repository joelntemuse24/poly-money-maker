<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polydesk</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%;
      background: #241f1a; color: #efe8de;
      font: 13px/1.3 "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      user-select: none;
    }
    .card {
      width: 228px; height: 268px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center;
    }
    .plate {
      width: 160px; height: 160px; margin-top: 28px;
      border-radius: 50%;
      background: #efe8de;
      border: 4px solid #d5ccc0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-sizing: border-box;
    }
    .plate.holding { background: #f6e4d8; border-color: #c4452d; }
    .usd { font-size: 26px; font-weight: 700; color: #2b241c; letter-spacing: -0.03em; }
    .cap { margin-top: 6px; font-size: 11px; font-weight: 700; color: #6f675e; letter-spacing: 0.08em; }
    .plate.holding .cap { color: #c4452d; }
    .sub { margin-top: 4px; font-size: 9px; color: #7a736a; max-width: 130px; text-align: center; }
    .meta { margin-top: 18px; text-align: center; color: #8a8178; font-size: 8px; font-weight: 700; letter-spacing: 0.14em; }
    .tail { margin-top: 6px; color: #6a635c; font-size: 8px; }
    .hint { margin-top: 8px; color: #4e4842; font-size: 7px; }
    button {
      margin-top: 8px; background: transparent; color: #8a8178; border: 0;
      font-size: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="plate" id="plate">
      <div class="usd" id="usd">—</div>
      <div class="cap" id="cap">…</div>
      <div class="sub" id="sub">connecting</div>
    </div>
    <div class="meta">POLYDESK</div>
    <div class="tail" id="tail">set address</div>
    <div class="hint">chrome app window · public data api</div>
    <button type="button" id="set">set address</button>
  </div>
  <script>
    const API = "https://data-api.polymarket.com";
    const KEY = "polydesk.address";
    const ADDR = /^0x[a-fA-F0-9]{40}$/;
    const q = new URLSearchParams(location.search);
    let address = (q.get("address") || localStorage.getItem(KEY) || "").trim();

    function fmt(n) {
      if (n == null || Number.isNaN(n)) return "—";
      return Math.abs(n) >= 1000 ? "$" + Math.round(n).toLocaleString() : "$" + n.toFixed(2);
    }
    function short(a) { return ADDR.test(a) ? a.slice(0, 6) + "…" + a.slice(-4) : "set address"; }

    async function tick() {
      const plate = document.getElementById("plate");
      const usd = document.getElementById("usd");
      const cap = document.getElementById("cap");
      const sub = document.getElementById("sub");
      const tail = document.getElementById("tail");
      tail.textContent = short(address);
      if (!ADDR.test(address)) {
        usd.textContent = "—"; cap.textContent = "OFFLINE"; sub.textContent = "double-click set";
        plate.classList.remove("holding");
        return;
      }
      try {
        const [vRes, pRes] = await Promise.all([
          fetch(API + "/value?user=" + address),
          fetch(API + "/positions?user=" + address + "&sizeThreshold=0.01&limit=50&sortBy=CURRENT&sortDirection=DESC"),
        ]);
        const vJson = await vRes.json();
        const rows = await pRes.json();
        const value = Array.isArray(vJson) ? vJson[0]?.value : vJson?.value;
        const held = (Array.isArray(rows) ? rows : []).filter((r) => Number(r.size) >= 0.01);
        const holding = held.length > 0;
        usd.textContent = fmt(Number(value));
        cap.textContent = holding ? "HOLDING" : "FLAT";
        sub.textContent = holding ? (held.length + " position" + (held.length === 1 ? "" : "s")) : "no open size";
        plate.classList.toggle("holding", holding);
        tail.textContent = "live · " + short(address);
      } catch (err) {
        cap.textContent = "OFFLINE";
        sub.textContent = String(err).slice(0, 28);
        plate.classList.remove("holding");
      }
    }

    document.getElementById("set").onclick = () => {
      const next = prompt("Polymarket proxy (FUNDER_ADDRESS)", address || "0x");
      if (!next) return;
      if (!ADDR.test(next.trim())) return;
      address = next.trim();
      localStorage.setItem(KEY, address);
      tick();
    };
    tick();
    setInterval(tick, 6000);
  </script>
</body>
</html>
