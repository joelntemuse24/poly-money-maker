# Cap systemd journal so a small disk cannot fill from host logs,
# without deleting a day before polyarchive.timer has copied it.
#
# Measured on the live VM 2026-10-15: /var/log/journal was 99M against
# SystemMaxUse=100M, and the oldest closed system journal file was
# 2026-10-12. A drop-in /etc/systemd/journald.conf.d/99-size.conf set
# SystemMaxUse=100M and MaxFileSec=3day, which is what vacuumed history.
# This repo file previously set MaxRetentionSec=7day (age delete) and
# SystemMaxUse=50M. Neither is installed as the effective live config.
# Do not set MaxRetentionSec: that deletes by age even when the copy
# has not run.
#
# ~28MB/day was in use across system and user journals, so 400M is
# about two weeks — after the daily archive. SystemKeepFree=2G is the
# disk backstop (the July 2026 incident filled a 10GB disk from
# /var/log). The boot disk is 20GB with substantial free space as of
# 2026-10-15; RAM is the tight resource (~1GB, ~540MB available).
#
# Install (operator, not this repo):
#   sudo rm -f /etc/systemd/journald.conf.d/99-size.conf
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-size.conf /etc/systemd/journald.conf.d/size.conf
#   sudo systemctl restart systemd-journald
# Do not vacuum-size down to 50M as a steady state; that deletes
# journal the archive job has not copied. See deploy/RECORDER.md.

[Journal]
SystemMaxUse=400M
SystemKeepFree=2G
RuntimeMaxUse=50M
SystemMaxFileSize=32M
MaxFileSec=1day
