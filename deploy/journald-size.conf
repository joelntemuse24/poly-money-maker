# Cap systemd journal so a small GCP boot disk cannot fill from logs.
# Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-size.conf /etc/systemd/journald.conf.d/size.conf
#   sudo systemctl restart systemd-journald
#   sudo journalctl --vacuum-size=50M
#
# Incident (2026-07): 10GB root disk hit 100% with ~5GB under /var/log.
# sim_data was only a few MB — host logs were the main consumer.

[Journal]
SystemMaxUse=50M
RuntimeMaxUse=20M
SystemMaxFileSize=10M
MaxRetentionSec=7day
